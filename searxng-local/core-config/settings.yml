use_default_settings: true

server:
  secret_key: "koi-lamba-random-string-yahan-dalo"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
  # Engine fail hone par ghanton tak band na rahe (default bahut lamba hota hai)
  suspended_times:
    SearxEngineAccessDenied: 60
    SearxEngineCaptcha: 60
    SearxEngineTooManyRequests: 60
    cf_SearxEngineCaptcha: 60
    cf_SearxEngineAccessDenied: 60
    recaptcha_SearxEngineCaptcha: 60

# IMPORTANT: "outgoing" top-level par hona chahiye (pehle search ke andar tha, isliye apply nahi hota tha)
outgoing:
  request_timeout: 10.0
  max_request_timeout: 20.0

engines:
  # YouTube videos ke liye
  - name: youtube
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: duckduckgo videos
    disabled: true
  - name: google videos
    disabled: true
  - name: vimeo
    disabled: true
  - name: bing videos
    disabled: true